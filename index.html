<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legenda Batu Menangis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: viewer gelap satu layar — buku di tengah panggung hitam, panah besar di sisi kiri-kanan,
   toolbar bulat melayang di bawah, dan grid thumbnail sebagai lapisan penuh. */
:root {
  --bg: #0B0B0C;
  --bar: #151517;
  --bar-line: #2C2C30;
  --fg: #F2F2F3;
  --muted: #9A9AA2;
  --hover: rgba(255, 255, 255, .08);
  --accent: #D9A04B;      /* oker dari bar keterangan komik */
  --accent-ink: #1B1306;
  --shadow: rgba(0, 0, 0, .7);
  --toolbar-h: 58px;
  --gutter: 104px;        /* ruang untuk panah di desktop */
  --pad-top: 44px;
  --pad-bottom: calc(var(--toolbar-h) + 36px);
  --toolbar-bottom: 18px;
  --zoom: 1;
  --font-display: "Josefin Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

/* Gaya dasar StPageFlip (ditulis langsung agar buku tetap tampil) */
.stf__parent { position: relative; display: block; box-sizing: border-box; transform: translateZ(0); touch-action: pan-y; }
.stf__wrapper, .sft__wrapper { position: relative; width: 100%; box-sizing: border-box; }
.stf__parent canvas { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
.stf__block { position: absolute; width: 100%; height: 100%; box-sizing: border-box; perspective: 2000px; }
.stf__item { display: none; position: absolute; transform-style: preserve-3d; }
.stf__outerShadow, .stf__innerShadow, .stf__hardShadow, .stf__hardInnerShadow { position: absolute; left: 0; top: 0; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
}

.reader {
  position: relative;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* Judul kecil di pojok kiri atas */
.brand {
  position: absolute;
  top: 14px;
  left: max(20px, env(safe-area-inset-left, 0px));
  z-index: 5;
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: .78rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  pointer-events: none;
}

/* Area buku — bisa digulir saat diperbesar */
.viewport {
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;       /* animasi balik halaman tidak memunculkan scrollbar */
  padding: var(--pad-top) var(--gutter) var(--pad-bottom);
  scrollbar-width: none;
}
.viewport::-webkit-scrollbar { display: none; }
.viewport.zoomed { overflow: auto; } /* saat diperbesar tetap bisa digeser, tanpa scrollbar terlihat */
/* Lebar pasti dihitung di JS (mode satu/dua halaman); ini hanya cadangan */
.stage {
  margin: auto;
  flex: none;
  width: calc(min(100vw - 2 * var(--gutter), (100vh - var(--toolbar-h) - 90px) * 2.84) * var(--zoom));
}
/* Sampul depan tampil di separuh kanan, sampul belakang di separuh kiri → geser buku agar sampul di tengah */
.stage.ready { transition: transform .75s cubic-bezier(.4, 0, .2, 1); }
.stage.at-cover { transform: translateX(-25%); }
.stage.at-back { transform: translateX(25%); }
#book { filter: drop-shadow(0 18px 36px var(--shadow)); }
.page { background: #1a1a1a; overflow: hidden; }
.page img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }

/* Panah besar di sisi */
.nav {
  position: absolute;
  top: calc(50% - var(--toolbar-h) / 2);
  transform: translateY(-50%);
  z-index: 6;
  width: 64px;
  height: 96px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 12px;
  background: none;
  color: var(--fg);
  cursor: pointer;
  transition: background .15s, opacity .15s;
}
.nav svg { width: 44px; height: 44px; }
.nav:hover:not(:disabled) { background: var(--hover); }
.nav:disabled { opacity: .18; cursor: default; }
.nav.prev { left: max(16px, env(safe-area-inset-left, 0px)); }
.nav.next { right: max(16px, env(safe-area-inset-right, 0px)); }

/* Toolbar bulat di bawah */
.toolbar {
  position: absolute;
  left: 50%;
  bottom: max(var(--toolbar-bottom), env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 7;
  height: var(--toolbar-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px 0 22px;
  background: var(--bar);
  border: 1px solid var(--bar-line);
  border-radius: 999px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  max-width: calc(100vw - 24px);
}
.counter {
  min-width: 78px;
  margin-right: 10px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tool {
  appearance: none;
  width: 44px;
  height: 44px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--fg);
  cursor: pointer;
  transition: background .15s, color .15s, opacity .15s;
}
.tool svg { width: 24px; height: 24px; }
.tool:hover:not(:disabled) { background: var(--hover); }
.tool:disabled { opacity: .3; cursor: default; }
.tool.on { color: var(--accent); }
.nav:focus-visible, .tool:focus-visible, .thumb:focus-visible, .close:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Grid thumbnail (daftar isi) */
.grid-layer {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  background: rgba(8, 8, 9, .96);
  padding: 22px max(20px, env(safe-area-inset-left, 0px)) 24px;
}
.grid-layer[hidden] { display: none; }
.grid-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto 18px;
}
.grid-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.close {
  appearance: none;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 1px solid var(--bar-line);
  border-radius: 50%;
  background: var(--bar);
  color: var(--fg);
  cursor: pointer;
}
.close svg { width: 20px; height: 20px; }
.grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  align-content: start;
  gap: 22px 18px;
  padding: 4px;
}
.thumb {
  appearance: none;
  border: 0;
  padding: 0;
  background: none;
  color: var(--fg);
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.thumb img {
  display: block;
  width: 100%;
  aspect-ratio: 1400 / 986;
  object-fit: cover;
  border-radius: 6px;
  border: 2px solid transparent;
  opacity: .8;
  transition: opacity .15s, border-color .15s;
}
.thumb:hover img { opacity: 1; }
.thumb.active img { border-color: var(--accent); opacity: 1; }
.thumb span { display: block; margin-top: 6px; font-size: .8rem; line-height: 1.3; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb span b { color: var(--fg); font-weight: 700; }
.thumb.active span b { color: var(--accent); }

/* Notifikasi singkat */
.toast {
  position: absolute;
  left: 50%;
  bottom: calc(var(--toolbar-h) + 32px);
  transform: translate(-50%, 8px);
  z-index: 12;
  padding: 10px 18px;
  border-radius: 8px;
  background: #2A2A2E;
  color: var(--fg);
  font-size: .9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* HP: buku selebar layar, panah melayang di atas halaman */
@media (max-width: 900px), (max-height: 500px) {
  :root { --gutter: 0px; --toolbar-h: 52px; --pad-top: 40px; --pad-bottom: calc(var(--toolbar-h) + 24px); }
  .nav { width: 40px; height: 60px; background: rgba(0, 0, 0, .4); }
  .nav svg { width: 28px; height: 28px; }
  .nav.prev { left: max(4px, env(safe-area-inset-left, 0px)); }
  .nav.next { right: max(4px, env(safe-area-inset-right, 0px)); }
  .toolbar { padding: 0 6px 0 16px; gap: 0; }
  .counter { min-width: 60px; margin-right: 4px; font-size: .95rem; }
  .tool { width: 40px; height: 40px; }
  .tool svg { width: 21px; height: 21px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px 12px; }
}
@media (max-width: 420px) {
  .tool.zoom { display: none; }
}
/* HP miring: judul disembunyikan, toolbar lebih tipis agar buku setinggi mungkin */
@media (max-height: 500px) and (orientation: landscape) {
  :root { --toolbar-h: 44px; --pad-top: 6px; --pad-bottom: calc(var(--toolbar-h) + 12px); --toolbar-bottom: 6px; }
  .brand { display: none; }
  .toolbar { padding-left: 14px; }
  .tool { width: 36px; height: 36px; }
  .counter { font-size: .9rem; }
}
@media (prefers-reduced-motion: reduce) {
  .nav, .tool, .thumb img, .toast, .stage.ready { transition: none; }
}
</style>

</head>
<body>
<div class="reader" id="reader">
  <p class="brand">Legenda Batu Menangis</p>

  <div class="viewport" id="viewport">
    <div class="stage">
      <div id="book" aria-label="Flipbook komik Legenda Batu Menangis"></div>
    </div>
  </div>

  <button class="nav prev" id="prev" type="button" aria-label="Halaman sebelumnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="nav next" id="next" type="button" aria-label="Halaman berikutnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <div class="toolbar" role="toolbar" aria-label="Kontrol flipbook">
    <div class="counter" id="counter" aria-live="polite">1 / 12</div>
    <button class="tool zoom" id="zoomOut" type="button" aria-label="Perkecil" title="Perkecil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
    <button class="tool zoom" id="zoomIn" type="button" aria-label="Perbesar" title="Perbesar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tool" id="gridBtn" type="button" aria-label="Semua halaman" title="Semua halaman">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    </button>
    <button class="tool" id="playBtn" type="button" aria-label="Putar otomatis" title="Putar otomatis">
      <svg viewBox="0 0 24 24" fill="currentColor"><path id="playIcon" d="M7 4.5l13 7.5-13 7.5z"/></svg>
    </button>
    <button class="tool" id="shareBtn" type="button" aria-label="Bagikan" title="Bagikan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg>
    </button>
    <button class="tool" id="fsBtn" type="button" aria-label="Layar penuh" title="Layar penuh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path id="fsIcon" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <div class="grid-layer" id="gridLayer" hidden role="dialog" aria-modal="true" aria-labelledby="gridTitle">
    <div class="grid-head">
      <h2 id="gridTitle">Semua halaman</h2>
      <button class="close" id="gridClose" type="button" aria-label="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  // Daftar halaman: indeks 0 = sampul, indeks n = halaman bernomor n di komik.
  const PAGES = [
    { scene: "Sampul" },
    { scene: "Darmi dan ibunya" },
    { scene: "" },
    { scene: "Pergi ke pasar" },
    { scene: "" },
    { scene: "Badai datang" },
    { scene: "" },
    { scene: "Kutukan" },
    { scene: "" },
    { scene: "Menjadi batu" },
    { scene: "" },
    { scene: "Penutup" }
  ].map((p, i) => {
    const n = String(i + 1).padStart(2, "0");
    return { ...p, src: `pages/p-${n}.jpg`, thumb: `thumbs/p-${n}.jpg` };
  });
  const LAST = PAGES.length - 1;
  const TOTAL = PAGES.length;

  // Halaman awal dari tautan (#p=5)
  const hashMatch = location.hash.match(/p=(\d+)/);
  const startPage = hashMatch ? Math.min(Math.max(+hashMatch[1] - 1, 0), LAST) : 0;

  // 1. Buat elemen halaman untuk flipbook
  const bookEl = document.getElementById("book");
  const stage = document.querySelector(".stage");
  PAGES.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "page";
    if (i === 0 || i === LAST) div.dataset.density = "hard"; // sampul depan & belakang kaku
    const img = document.createElement("img");
    img.src = p.src;
    img.alt = i === 0 ? "Sampul: Legenda Batu Menangis" : `Halaman ${i}`;
    img.draggable = false;
    div.appendChild(img);
    bookEl.appendChild(div);
  });

  // 2. Jalankan StPageFlip
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const book = new St.PageFlip(bookEl, {
    width: 700, height: 493,          // rasio halaman komik (1400 × 986)
    size: "stretch",
    minWidth: 1, maxWidth: 2000,      // mode satu/dua halaman diatur oleh layout()
    minHeight: 1, maxHeight: 1409,
    showCover: true,
    usePortrait: true,                // satu halaman di layar sempit
    startPage,
    maxShadowOpacity: 0.5,
    flippingTime: reduceMotion ? 1 : 750,
    mobileScrollSupport: false
  });
  book.loadFromHTML(bookEl.querySelectorAll(".page"));

  // 3. Grid thumbnail
  const grid = document.getElementById("grid");
  const gridLayer = document.getElementById("gridLayer");
  const gridBtn = document.getElementById("gridBtn");
  const thumbs = PAGES.map((p, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "thumb";
    const num = i === 0 ? "Sampul" : `Hal. ${i}`;
    const label = p.scene && i !== 0 ? `${num} · ${p.scene}` : num;
    b.setAttribute("aria-label", label);
    b.innerHTML = `<img src="${p.thumb}" alt="" loading="lazy"><span><b>${num}</b>${p.scene && i !== 0 ? " · " + p.scene : ""}</span>`;
    b.addEventListener("click", () => { closeGrid(); book.flip(i); });
    grid.appendChild(b);
    return b;
  });

  function openGrid() {
    gridLayer.hidden = false;
    gridBtn.classList.add("on");
    const active = grid.querySelector(".thumb.active") || thumbs[0];
    active.focus();
  }
  function closeGrid() {
    if (gridLayer.hidden) return;
    gridLayer.hidden = true;
    gridBtn.classList.remove("on");
    gridBtn.focus();
  }
  gridBtn.addEventListener("click", () => gridLayer.hidden ? openGrid() : closeGrid());
  document.getElementById("gridClose").addEventListener("click", closeGrid);

  // 4. Penghitung halaman + panah
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const counter = document.getElementById("counter");

  function visiblePages(i) {
    if (book.getOrientation() === "portrait" || i === 0 || i === LAST) return [i];
    const left = i % 2 === 1 ? i : i - 1;
    return [left, Math.min(left + 1, LAST)];
  }

  function update() {
    const i = book.getCurrentPageIndex();
    const vis = visiblePages(i);
    const shown = vis.length === 1 ? `${vis[0] + 1}` : `${vis[0] + 1}-${vis[1] + 1}`;
    counter.textContent = `${shown} / ${TOTAL}`;
    prevBtn.disabled = i <= 0;
    nextBtn.disabled = vis[vis.length - 1] >= LAST;
    thumbs.forEach((t, k) => t.classList.toggle("active", vis.includes(k)));
    const spread = book.getOrientation() !== "portrait";
    stage.classList.toggle("at-cover", spread && i === 0);
    stage.classList.toggle("at-back", spread && i === LAST);
    try { history.replaceState(null, "", i === 0 ? location.pathname + location.search : `#p=${i + 1}`); } catch (e) {}
    if (nextBtn.disabled) stopPlay();
  }

  book.on("flip", update);
  book.on("changeOrientation", update);
  book.on("init", update);
  // Saat sampul mulai dibalik, buku bergeser ke posisi dua halaman bersamaan dengan animasinya;
  // jika balikan dibatalkan, posisi dikembalikan saat buku diam lagi.
  book.on("changeState", e => {
    if (e.data === "flipping") stage.classList.remove("at-cover", "at-back");
    if (e.data === "read") update();
  });
  update();
  setTimeout(() => stage.classList.add("ready"), 100); // tanpa animasi saat pertama dimuat

  prevBtn.addEventListener("click", () => book.flipPrev());
  nextBtn.addEventListener("click", () => book.flipNext());

  // 5. Ukuran buku + zoom
  // Layar tegak (HP/tablet) → satu halaman selebar layar; layar lebar → dua halaman.
  // (StPageFlip berganti ke satu halaman saat lebar < 2 × minWidth, jadi minWidth diatur di sini.)
  const ZOOMS = [1, 1.25, 1.5, 2];
  let zoomIdx = 0;
  const zoomInBtn = document.getElementById("zoomIn");
  const zoomOutBtn = document.getElementById("zoomOut");
  const viewport = document.getElementById("viewport");
  const settings = book.getSettings();
  const RATIO = 1400 / 986;

  function layout() {
    const cs = getComputedStyle(viewport);
    const w = viewport.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = viewport.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const spread = Math.min(w, h * RATIO * 2);
    const single = Math.min(w, h * RATIO);
    const singleMode = w / h < RATIO * 1.05;
    settings.minWidth = singleMode ? 1e6 : 1;
    stage.style.width = Math.max(200, (singleMode ? single : spread) * ZOOMS[zoomIdx]) + "px";
    book.update();
  }
  window.addEventListener("resize", layout);

  function setZoom(idx) {
    zoomIdx = Math.min(Math.max(idx, 0), ZOOMS.length - 1);
    zoomOutBtn.disabled = zoomIdx === 0;
    zoomInBtn.disabled = zoomIdx === ZOOMS.length - 1;
    viewport.classList.toggle("zoomed", zoomIdx > 0);
    layout();
    // jaga agar tengah buku tetap di tengah layar
    requestAnimationFrame(() => {
      viewport.scrollLeft = (viewport.scrollWidth - viewport.clientWidth) / 2;
      viewport.scrollTop = (viewport.scrollHeight - viewport.clientHeight) / 2;
    });
  }
  zoomInBtn.addEventListener("click", () => setZoom(zoomIdx + 1));
  zoomOutBtn.addEventListener("click", () => setZoom(zoomIdx - 1));
  setZoom(0);

  // 6. Putar otomatis
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  let playTimer = null;
  function startPlay() {
    if (nextBtn.disabled) book.flip(0);
    playTimer = setInterval(() => book.flipNext(), 4000);
    playIcon.setAttribute("d", "M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z");
    playBtn.classList.add("on");
    playBtn.setAttribute("aria-label", "Jeda");
    playBtn.title = "Jeda";
  }
  function stopPlay() {
    if (!playTimer) return;
    clearInterval(playTimer);
    playTimer = null;
    playIcon.setAttribute("d", "M7 4.5l13 7.5-13 7.5z");
    playBtn.classList.remove("on");
    playBtn.setAttribute("aria-label", "Putar otomatis");
    playBtn.title = "Putar otomatis";
  }
  playBtn.addEventListener("click", () => playTimer ? stopPlay() : startPlay());

  // 7. Bagikan
  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }
  document.getElementById("shareBtn").addEventListener("click", async () => {
    const data = { title: document.title, url: location.href };
    try {
      if (navigator.share) { await navigator.share(data); return; }
      await navigator.clipboard.writeText(location.href);
      showToast("Tautan halaman disalin");
    } catch (err) {
      if (err && err.name !== "AbortError") showToast("Tidak bisa membagikan dari perangkat ini");
    }
  });

  // 8. Layar penuh (tidak semua perangkat mendukung)
  const fsBtn = document.getElementById("fsBtn");
  const fsIcon = document.getElementById("fsIcon");
  const reader = document.getElementById("reader");
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await reader.requestFullscreen();
    } catch (err) { fsBtn.hidden = true; }
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fsIcon.setAttribute("d", on ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");
    fsBtn.setAttribute("aria-label", on ? "Keluar layar penuh" : "Layar penuh");
    setTimeout(layout, 60);
  });

  // 9. Keyboard
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeGrid(); return; }
    if (!gridLayer.hidden) return;
    if (e.key === "ArrowRight") book.flipNext();
    if (e.key === "ArrowLeft") book.flipPrev();
    if (e.key === "+" || e.key === "=") setZoom(zoomIdx + 1);
    if (e.key === "-") setZoom(zoomIdx - 1);
  });
</script>

</body>
</html>
